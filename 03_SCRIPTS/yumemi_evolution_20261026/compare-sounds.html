<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゆめみん版｜音の比較</title>
<style>body{background:#171322;color:#fff;font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px}h1{font-size:25px}video{width:100%;border-radius:12px;background:#000;margin:18px 0}.buttons{display:flex;gap:10px;flex-wrap:wrap}button{background:#322844;color:#fff;border:1px solid #726084;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer}button.active{background:#9b4de0;border-color:#d4abff}p{color:#d3c9df;line-height:1.6}small{color:#b9abc9}a{color:#dfbbff}</style>
<h1>ゆめみん版 — 効果音を比較</h1><p>映像・声・尺は共通。切り替えても再生位置を維持します。</p>
<div class="buttons"><button data-v="keynote" class="active">① 無駄に意識高い</button><button data-v="comedy">② お笑い</button><button data-v="intense">③ 激しめ</button><button data-v="only">効果音なし</button></div>
<video id="v" controls preload="metadata" src="final_remotion_yumemin_keynote.mp4"></video>
<div class="buttons"><button id="restart">最初から再生</button></div><p id="desc">キラキラした決定音と、何か達成するたびに大げさな拍手。</p>
<small>効果音：Kenney（CC0）。拍手：Amada44（CC0）。笑い声：<a href="https://freesound.org/people/Kyster/sounds/124028/">Kyster「big crowd laughter.wav」</a>（<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>、抜粋・音量・フェード調整）。</small>
<script>const v=document.querySelector('#v');const descriptions={keynote:'キラキラした決定音と、何か達成するたびに大げさな拍手。',comedy:'コミカルな短い音、サックスの合いの手、観客の笑い声。',intense:'ヒット音・レーザー・パワーアップ音を密に重ねたゲームPV風。',only:'比較用のゆめみん単独版。効果音なし。'};let rev=0;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const time=v.currentTime,playing=!v.paused,id=++rev;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x===b));v.src='final_remotion_yumemin_'+b.dataset.v+'.mp4';v.onloadedmetadata=()=>{if(id!==rev)return;v.currentTime=Math.min(time,Math.max(0,v.duration-.05));if(playing)v.play().catch(()=>{});};document.querySelector('#desc').textContent=descriptions[b.dataset.v];});document.querySelector('#restart').onclick=()=>{v.currentTime=0;v.play().catch(()=>{});};</script></html>
